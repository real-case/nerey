name: Workbench

# ADR 0044 — the workbench is the documentation for a library of components, and it existed only on
# a developer's machine. This publishes it, and — the half that matters more — it is the first thing
# in this repository ever to run `build-storybook` outside somebody's terminal.
#
# The story suite runs against Vite's DEV server (ADR 0031). A static build is a different pipeline:
# it bundles, hashes assets and inlines the story index, and it can break without any existing check
# noticing. `docs/verification.md` has recorded that gap since the initial build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing at the workflow level. `id-token: write` is granted to the deploy job alone, so the build
# job — the one that executes story code from a pull request — cannot mint a token for anything
# (ADR 0043).
permissions: {}

# Not cancel-in-progress: a half-finished Pages deployment is not a state worth racing another one
# into, and the build is cheap enough that finishing it costs less than reasoning about the result.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_OPTIONS: --no-warnings=ExperimentalWarning

jobs:
  # The gate. Runs everywhere, publishes nothing, and blocks a merge when the static build breaks.
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Passed to the smoke check below. Comparing the published index against THIS run's count is
    # what distinguishes a healthy deployment from a stale one; a floor would pass both (ADR 0044).
    outputs:
      stories: ${{ steps.count.outputs.stories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: build-storybook
        run: npm run build-storybook

      - name: count the stories built
        id: count
        run: |
          stories=$(node -e "
            const index = require('./storybook-static/index.json');
            const entries = Object.values(index.entries ?? {});
            console.log(entries.filter((entry) => entry.type === 'story').length);
          ")
          echo "stories=$stories" >> "$GITHUB_OUTPUT"
          echo "built $stories stories"

      # Uploaded unconditionally, deployed conditionally. The artifact has to come from the same run
      # as the deploy, so it is produced on pull requests too and simply goes unused there.
      - name: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  # Only from `main`, and only on a build that actually happened. A pull request cannot publish.
  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # ADR 0044 recorded that nothing checked whether the published site WORKS — the build
      # succeeding proves the artifact was produced, not that its story index loads. This is the
      # only check here that depends on the network, which is why it lives after the publish rather
      # than in `check:all`: it can only be true of a site that exists.
      #
      # It runs AFTER the deploy on purpose. A failure here means "published, and not serving what
      # we published", which is a true and useful thing to be told; blocking the publish on it
      # would mean never publishing the fix.
      - name: smoke the published site
        run: >
          node scripts/check-published-site.mjs
          --url ${{ steps.deployment.outputs.page_url }}
          --expect-stories ${{ needs.build.outputs.stories }}
